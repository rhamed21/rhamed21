<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roa’a Hamed — Economist</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5F4;--sf:#fff;--ink:#13262B;--mu:#4F6368;--ln:#CBD6D4;--ac:#0E6B66;--hl:#C2410C;--soft:#E3EEEC;
--se:"Newsreader",Georgia,serif;--sa:"IBM Plex Sans",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A1C;--sf:#16262A;--ink:#E7EFEE;--mu:#9DB0B1;--ln:#2B4045;--ac:#5CC4BC;--hl:#F59E6B;--soft:#1D3236}}
:root[data-theme="dark"]{--bg:#0F1A1C;--sf:#16262A;--ink:#E7EFEE;--mu:#9DB0B1;--ln:#2B4045;--ac:#5CC4BC;--hl:#F59E6B;--soft:#1D3236}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.03rem/1.6 var(--sa)}
a{color:var(--ac);text-underline-offset:3px}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.w{max-width:1100px;margin:0 auto;padding:0 1.5rem}
header{display:flex;justify-content:space-between;align-items:center;padding:1.1rem 0;border-bottom:1px solid var(--ln);flex-wrap:wrap;gap:.5rem}
header a.b{font:600 1.15rem var(--se);color:var(--ink);text-decoration:none}
nav a{margin-left:1.2rem;color:var(--mu);text-decoration:none;font-size:.95rem}nav a:hover,nav a.on{color:var(--ink)}
h1{font:600 clamp(2rem,4.5vw,3rem)/1.1 var(--se);margin:0 0 .4rem}h2{font:600 1.6rem/1.2 var(--se);margin:0 0 1rem}h3{font:600 1.15rem/1.3 var(--se);margin:0 0 .4rem}
.cr{display:inline-block;margin-left:.7rem;font:500 .36em var(--sa);letter-spacing:.03em;color:var(--ac);vertical-align:middle}.btn{display:inline-flex;align-items:center;gap:.5rem;vertical-align:top;padding:.6rem 1.1rem;border-radius:4px;background:var(--ac);color:var(--bg);text-decoration:none;font:500 .97rem var(--sa);margin:0 .5rem .5rem 0;border:1px solid var(--ac);cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--ln)}
.snap{max-width:46rem;padding:2.5rem 0}.role{font:500 1.1rem var(--sa);color:var(--ac);margin:0 0 1rem}
.why{list-style:none;padding:0;margin:1rem 0 1.2rem}.why li{padding:.55rem 0 .55rem 1.1rem;border-left:3px solid var(--ac);margin-bottom:.5rem;background:var(--sf)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:1.2rem 1.3rem}.card h3{font:500 .8rem var(--sa);letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:1rem 0 .4rem}.card h3:first-child{margin-top:0}
.ed{margin:0 0 .5rem;line-height:1.35}.ed small{display:block;color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:0;padding:0;list-style:none}.chips li,.chip{font:400 .86rem var(--sa);padding:.2rem .65rem;border:1px solid var(--ln);border-radius:99px;background:var(--bg);color:var(--ink)}
.chips.k li{background:var(--soft);border-color:transparent;font-weight:500}
section{padding:2.5rem 0;border-top:1px solid var(--ln)}
.bar{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.9rem}.tab,.fc{font:500 .92rem var(--sa);padding:.4rem .9rem;border:1px solid var(--ln);border-radius:99px;background:var(--sf);color:var(--ink);cursor:pointer}
.tab[aria-pressed=true]{background:var(--ac);color:var(--bg);border-color:var(--ac)}.fc{font-weight:400;font-size:.86rem;padding:.25rem .7rem}.fc[aria-pressed=true]{background:var(--soft);border-color:var(--ac)}
.fl{font-size:.82rem;color:var(--mu);margin:.6rem 0 .3rem}.cnt{color:var(--mu);font-size:.9rem;margin:1rem 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.2rem}.dashl{display:grid;grid-template-columns:1fr 250px;gap:1.5rem;align-items:start}.fp{position:sticky;top:1rem}.chips li.m{background:var(--soft);border-color:transparent;font-weight:500}.lk{background:none;border:0;color:var(--ac);cursor:pointer;font:400 .88rem var(--sa);padding:.5rem 0;text-decoration:underline}
.tile{display:flex;flex-direction:column;background:var(--sf);border:1px solid var(--ln);border-radius:8px;overflow:hidden;color:var(--ink);text-decoration:none}.tile:hover{border-color:var(--ac)}
.th{position:relative;aspect-ratio:16/10;background:#fff;border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:center}
.th img{max-width:100%;max-height:100%;object-fit:contain;padding:.4rem}.th .ph{font-size:3rem}
.ic{position:absolute;top:.5rem;left:.5rem;width:2.2rem;height:2.2rem;border-radius:50%;background:var(--ac);display:flex;align-items:center;justify-content:center;font-size:1.1rem;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.ty{position:absolute;top:.6rem;right:.6rem;font:500 .72rem var(--sa);background:#13262B;color:#fff;padding:.1rem .5rem;border-radius:99px}
.tb{padding:.9rem 1.1rem 1.1rem;display:flex;flex-direction:column;gap:.5rem;flex:1}.tb h3{margin:0}.tb .chips li{font-size:.78rem;padding:.1rem .5rem}.tp{color:var(--mu);font-size:.85rem}
.crumb{display:inline-block;margin:1.5rem 0 0;font-size:.95rem}.meta{color:var(--mu);margin:0 0 1rem}
.four{display:grid;grid-template-columns:1fr 1fr;gap:1rem 2rem;margin:1.5rem 0 2rem}.four h3{color:var(--ac)}.four ul{margin:0;padding-left:1.1rem}.four li{margin-bottom:.35rem}
figure.f{margin:0 0 1.5rem;background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:1rem}figure.f img{width:100%;height:auto;display:block;background:#fff}figure.f figcaption{font-size:.92rem;color:var(--mu);margin-top:.6rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:2.5rem}.two p{margin:0 0 1rem}
.cvl{display:grid;grid-template-columns:1fr 300px;gap:1.5rem;align-items:start}.sel{position:sticky;top:1rem}.sel label{display:flex;gap:.6rem;padding:.3rem 0;cursor:pointer;font-size:.93rem;line-height:1.3}
#cv{background:#fff;color:#111;border:1px solid var(--ln);padding:1.6rem 1.8rem;font:400 .86rem/1.4 var(--sa)}#cv a{color:#141E61}
#cv h2{font:600 1.9rem var(--se);color:#141E61;margin:0;text-align:center}#cv .key{text-align:center;font-size:.8rem;margin:.3rem 0 .2rem;color:#333}
#cv h4{font:600 .9rem var(--sa);letter-spacing:.14em;text-transform:uppercase;color:#141E61;border-bottom:1.5px solid #141E61;margin:.9rem 0 .4rem;padding-bottom:.15rem}
#cv .r{display:flex;justify-content:space-between;gap:1rem}#cv .r b{font-weight:600}#cv .r span{color:#141E61;white-space:nowrap}#cv .s{font-style:italic;color:#333;font-size:.82rem}#cv ul{margin:.2rem 0 .5rem;padding-left:1.1rem}#cv li{margin-bottom:.2rem}
footer{padding:2rem 0 3rem;color:var(--mu);font-size:.9rem;border-top:1px solid var(--ln)}
@media(max-width:900px){.dashl{grid-template-columns:1fr}.fp{position:static;order:-1}.cvl{grid-template-columns:1fr}.sel{position:static;order:-1}}
@media(max-width:640px){.grid,.four,.two{grid-template-columns:1fr}nav a{margin:0 .8rem 0 0}}
@media print{@page{margin:12mm}header,footer,.noprint,.crumb{display:none!important}body{background:#fff}.w{max-width:none;padding:0}.cvl{display:block}#cv{border:0;padding:0}}
</style></head><body>

const cv=()=>`<h1 class="noprint" style="margin-top:2rem;font-size:2rem">CV builder</h1><p class="meta noprint">Pick the skills to highlight. The CV shows the matching experience and research. Private details in grey brackets are filled in when you download the PDF.</p>
<div class="cvl"><div id="cv">${cvh()}</div><aside class="card sel noprint"><h3>Presets</h3><div class="bar">${Object.keys(PR).map(k=>`<button class="fc" data-pre="${k}">${k}</button>`).join('')}</div><h3>Key skills</h3>${Object.keys(SK).map(k=>`<label><input type="checkbox" data-id="${k}" ${sel.has(k)?'checked':''}> <span>${SK[k][0]}</span></label>`).join('')}<p style="margin-top:1rem"><button class="btn" id="dl">Download PDF</button></p><p class="tp">Opens the print dialog. Choose “Save as PDF”.</p></aside></div>`;
function bindCv(){const up=()=>document.getElementById('cv').innerHTML=cvh();
document.querySelectorAll('[data-id]').forEach(i=>i.onchange=()=>{i.checked?sel.add(i.dataset.id):sel.delete(i.dataset.id);up()});
document.querySelectorAll('[data-pre]').forEach(b=>b.onclick=()=>{sel=new Set(PR[b.dataset.pre]);document.querySelectorAll('[data-id]').forEach(i=>i.checked=sel.has(i.dataset.id));up()});

function render(){const h=location.hash.replace(/^#\/?/,'');const a=document.getElementById('app');let r='home';
if(h.startsWith('work/')){const p=byId(h.slice(5));a.innerHTML=p?proj(p):home();r='p'}else if(h==='cv'){a.innerHTML=cv();bindCv();r='cv'}else{a.innerHTML=home();dash();bindDash()}

if(h==='projects'||h==='contact')document.getElementById(h).scrollIntoView();else scrollTo(0,0)}
function bindDash(){document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k,v=b.dataset.v;if(k==='ty')F.ty=v;else F[k].has(v)?F[k].delete(v):F[k].add(v);dash()});document.getElementById('clr').onclick=()=>{F={ty:'All',top:new Set(),met:new Set(),sw:new Set()};dash()};const em=document.getElementById('em'),t=document.getElementById('emt');em.onclick=()=>{em.href='mailto:'+SEC.e;em.target='_blank';em.rel='noopener';t.textContent=SEC.e;if(navigator.clipboard)navigator.clipboard.writeText(SEC.e).then(()=>t.textContent=SEC.e+' (copied)',()=>{})}}
